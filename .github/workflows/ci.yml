name: CI

on:
  push:
  pull_request:

jobs:
  ready:
    name: Check, Test, Build
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - run: vp install --frozen-lockfile

      - run: vp run ready
