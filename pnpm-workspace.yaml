packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  msw: true

catalog:
  '@fontsource-variable/cormorant-garamond': ^5.2.6
  '@fontsource-variable/inter': ^5.2.8
  '@tailwindcss/vite': ^4.2.4
  '@types/node': ^24
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.12.0
  radix-ui: ^1.4.3
  react: ^19.2.5
  react-dom: ^19.2.5
  shadcn: ^4.6.0
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.2.4
  tw-animate-css: ^1.4.0
  typescript: ^6
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
