packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  esbuild: true
  msw: true
  sharp: true

catalog:
  '@aws-sdk/client-s3': ^3.726.0
  '@fontsource-variable/cormorant-garamond': ^5.2.6
  '@fontsource-variable/inter': ^5.2.8
  '@tailwindcss/vite': ^4.2.4
  '@types/node': ^24
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.1
  blurhash: ^2.0.5
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.12.0
  p-limit: ^6.2.0
  radix-ui: ^1.4.3
  react: ^19.2.5
  react-dom: ^19.2.5
  react-photo-album: ^3.2.1
  shadcn: ^4.6.0
  sharp: ^0.34.1
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.2.4
  tsx: ^4.20.0
  tw-animate-css: ^1.4.0
  typescript: ^6
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  zod: ^4.0.0

catalogMode: prefer
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
